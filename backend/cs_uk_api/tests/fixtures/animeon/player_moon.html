(function () {
	"use strict";

	var BANNED_DOMAINS = ["animegram.online"];

	function normalizeHost(raw) {
		if (!raw) return "";
		try {
			var host = raw.indexOf("://") === -1 ? raw : new URL(raw).hostname;
			return host.replace(/^www\./i, "").toLowerCase();
		} catch (e) {
			return "";
		}
	}

	function isBanned(host) {
		return !!host && BANNED_DOMAINS.indexOf(host) !== -1;
	}

	function triggerBan() {
		var s = document.createElement("script");
		s.src = "/static/js/ban.js";
		(document.head || document.documentElement).appendChild(s);
	}

	var parentHost = "";
	try {
		if (window.location.ancestorOrigins && window.location.ancestorOrigins.length) {
			parentHost = normalizeHost(window.location.ancestorOrigins[window.location.ancestorOrigins.length - 1]);
		} else if (document.referrer) {
			parentHost = normalizeHost(document.referrer);
		}
	} catch (e) {}

	if (isBanned(parentHost)) {
		triggerBan();
	}
})();
</script>
