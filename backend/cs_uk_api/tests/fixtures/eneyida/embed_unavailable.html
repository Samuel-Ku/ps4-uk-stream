<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контент недоступний</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #222;
    }

    .container {
        text-align: center;
        max-width: 500px;
        padding: 40px 24px;
    }

    .code {
        font-size: 72px;
        font-weight: 700;
        color: #e5e7eb;
        line-height: 1;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    p {
        font-size: 16px;
        line-height: 1.6;
        color: #6b7280;
    }

    .divider {
        width: 60px;
        height: 3px;
        background: #2563eb;
        margin: 24px auto;
        border-radius: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="code">&#128274;</div>
        <h1>Контент недоступний</h1>
        <div class="divider"></div>
        <p>
            На жаль, ця сторінка недоступна
        </p>
    </div>
</body>
</html>
