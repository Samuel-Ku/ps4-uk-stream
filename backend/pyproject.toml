[project]
name = "cs-uk-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "cachetools>=5.3",
  "pycryptodome>=3.20",
  "playwright>=1.40",
  # WebP transcode for the Jellyfin image routes (avatar + poster
  # `format=Webp`): Pillow is imported lazily inside the transcode
  # helpers, but a fresh install must still ship it (ticket #291 found
  # the missing dep — the existing venv only had it by accident).
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The package list is pinned explicitly (ticket #291): the deploy/
# directory is a sibling top-level dir, and setuptools flat-layout
# auto-discovery would refuse to build with two top-level packages
# ("Multiple top-level packages discovered: ['deploy', 'cs_uk_api']").
# Only the cs_uk_api package ships; deploy/ stays source-only.
[tool.setuptools]
packages = ["cs_uk_api"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["cs_uk_api/tests"]
markers = [
    "unit: pure-Python unit tests (no I/O, no providers, no HTTP)",
    "integration: tests that exercise the FastAPI app (TestClient, providers)",
    "e2e: end-to-end tests against a live backend",
]

[tool.mypy]
python_version = "3.11"
strict = true
# Release gate: strict typing is enforced on the shipped package.
# Test files are excluded from the strict gate — they are deliberately
# loose (stub providers, respx mocks); run `mypy cs_uk_api` to verify.
exclude = ["cs_uk_api/tests/"]

[tool.ruff]
line-length = 100
target-version = "py311"
