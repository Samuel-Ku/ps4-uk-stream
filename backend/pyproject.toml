[project]
name = "cs-uk-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "cachetools>=5.3",
  "pycryptodome>=3.20",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["cs_uk_api/tests"]
markers = [
    "unit: pure-Python unit tests (no I/O, no providers, no HTTP)",
    "integration: tests that exercise the FastAPI app (TestClient, providers)",
    "e2e: end-to-end tests against a live backend",
]

[tool.mypy]
python_version = "3.11"
strict = true
# Release gate: strict typing is enforced on the shipped package.
# Test files are excluded from the strict gate — they are deliberately
# loose (stub providers, respx mocks); run `mypy cs_uk_api` to verify.
exclude = ["cs_uk_api/tests/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
# The deploy/ directory broke setuptools' flat-layout auto-discovery
# ("Multiple top-level packages discovered") — pin the package list.
packages = ["cs_uk_api"]
