            - request: "POST /Items/[^ ]+/PlaybackInfo -> 200"
              status: 200
            - request: "GET /Videos/[^ ]+/stream -> (200|206|302)"
              status: [200, 206, 302]
            - request: "POST /Sessions/Playing -> 204"
              status: 204

