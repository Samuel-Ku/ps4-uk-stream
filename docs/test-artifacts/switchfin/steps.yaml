  - name: warmup_cartoon
    phase: warmup
    view_id: 6df359d3895d57238985daa902e73416
    use_token: true
    expect:
      - request: "GET (/Users/[^ ]+)?/Items -> 200"
        status: 200
  - name: warmup_dorama
    phase: warmup
    view_id: fea6fe2911a85e5d87c0150ccf69aa90
    use_token: true
    expect:
      - request: "GET (/Users/[^ ]+)?/Items -> 200"
        status: 200

  # ---- open each library view + its first card (#145) ------------------
  - name: open_view_newest
    phase: open
    view: newest
    view_id: ac357d43a6e459568e061ae4368543d5
    tap: view_newest_x
    expect:
      - request: "GET (/Users/[^ ]+)?/Items -> 200"
        status: 200

  - name: open_first_card_newest
    phase: detail
    view: newest
    tap: first_card
    expect:
      - request: *gk_request
        status: 200
        capture: gk

  - name: play_newest
    phase: play
    view: newest
    branches:
      movie:
        - tap: play_button
          expect:
            - request: "POST /Items/[^ ]+/PlaybackInfo -> 200"
              status: 200
            - request: "GET /Videos/[^ ]+/stream -> (200|206|302)"
              status: [200, 206, 302]
            - request: "POST /Sessions/Playing -> 204"
              status: 204
      series:
        - tap: first_season
          scroll_before: [1584, 1100, 1584, 400, 500]
          expect:
            - request: "GET /Shows/[^ ]+/Episodes -> 200"
              status: 200
        - tap: first_episode
