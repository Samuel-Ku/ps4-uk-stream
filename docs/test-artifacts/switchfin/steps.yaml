  # self-issued detail request, then executes that branch's taps:
  #   movie  : play_button                       (1 tap)
  #   series : seasons_tab -> first_season -> first_episode -> play_button
  - name: play_newest
    phase: play
    view: newest
    branches:
      movie:
        - tap: play_button
          expect:
            - request: "POST /Items/[^ ]+/PlaybackInfo -> 200"
              status: 200
            - request: "GET /Videos/[^ ]+/stream -> (200|302)"
              status: [200, 302]
            - request: "POST /Sessions/Playing -> 204"
              status: 204
      series:
        - tap: seasons_tab
          expect:
            - request: "GET /Shows/[^ ]+/Seasons -> 200"
              status: 200
        - tap: first_season
          expect:
            - request: "GET /Shows/[^ ]+/Episodes -> 200"
              status: 200
        - tap: first_episode
        - tap: play_button
          expect:
